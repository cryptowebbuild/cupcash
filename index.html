<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<title>CupCash 🏆 — World Cup 2026 Predictor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ═══════════════════════════════════════
   CUP CASH v3.0 — PREMIUM TELEGRAM MINI APP
   Design: Glassmorphism + Telegram Native
   ═══════════════════════════════════════ */
:root {
  --bg: #0a0e17;
  --surface: #111827;
  --card: #1a2332;
  --card-hover: #1f2b3d;
  --border: #2a3a4e;
  --gold: #fbbf24;
  --gold-dim: #b45309;
  --green: #34d399;
  --red: #f87171;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #475569;
  --radius: 14px;
  --radius-sm: 10px;
  --tg-bg: var(--bg);
  --tg-text: var(--text);
  --tg-hint: var(--text2);
  --tg-button: var(--gold);
  --tg-button-text: #000;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── LOADER ── */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.5s;
}
#loader.done { opacity: 0; pointer-events: none; }
.loader-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { margin-top: 16px; color: var(--text2); font-size: 14px; }

/* ── HEADER ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,14,23,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.logo {
  display: flex; align-items: center; gap: 8px;
  font-size: 18px; font-weight: 700;
}
.logo-icon { font-size: 24px; }
.pool-badge {
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  color: #000;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 13px; font-weight: 700;
}

/* ── TABS ── */
.tabs {
  display: flex; gap: 4px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 3px;
}
.tab {
  flex: 1;
  padding: 8px 4px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.tab.active {
  background: var(--gold);
  color: #000;
}
.tab-icon { display: block; font-size: 16px; margin-bottom: 2px; }

/* ── CONTENT ── */
.content { padding: 16px; padding-bottom: 100px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── STATS BAR ── */
.stats-bar {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 16px;
}
.stat-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
}
.stat-val {
  font-size: 18px; font-weight: 700;
  color: var(--gold);
}
.stat-lbl {
  font-size: 10px; color: var(--text3);
  margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px;
}

/* ── MATCH CARD ── */
.match-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  transition: all 0.2s;
}
.match-card:active { transform: scale(0.98); }
.match-card.live { border-color: var(--green); }
.match-card.completed { opacity: 0.7; }
.match-card.has-pred { border-color: var(--gold); }

.match-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: rgba(255,255,255,0.02);
  border-bottom: 1px solid var(--border);
}
.match-group {
  font-size: 11px; color: var(--text3); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.match-badge {
  font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 10px;
}
.badge-live { background: rgba(52,211,153,0.15); color: var(--green); }
.badge-scheduled { background: rgba(96,165,250,0.15); color: var(--blue); }
.badge-completed { background: rgba(148,163,184,0.15); color: var(--text3); }

.match-body { padding: 14px; }
.match-time {
  display: flex; gap: 12px; margin-bottom: 12px;
  font-size: 11px; color: var(--text2);
}
.match-time-item { display: flex; align-items: center; gap: 4px; }

.match-teams {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.team {
  flex: 1; text-align: center;
}
.team-flag { font-size: 28px; margin-bottom: 4px; }
.team-name { font-size: 13px; font-weight: 600; }
.team-code { font-size: 10px; color: var(--text3); margin-top: 2px; }

.match-center { text-align: center; min-width: 60px; }
.match-score {
  font-size: 24px; font-weight: 800;
  color: var(--text);
}
.match-score .sep { color: var(--text3); margin: 0 4px; }
.match-vs {
  font-size: 14px; font-weight: 700; color: var(--text3);
}

/* ── PREDICTION AREA ── */
.pred-area {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
}
.pred-label {
  font-size: 11px; color: var(--text2); font-weight: 600;
  margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
}
.pred-row {
  display: flex; gap: 6px;
}
.pred-btn {
  flex: 1;
  padding: 10px 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.pred-btn:hover { background: var(--card-hover); }
.pred-btn.selected {
  border-color: var(--gold);
  background: rgba(251,191,36,0.1);
  color: var(--gold);
}
.pred-btn-emoji { display: block; font-size: 16px; margin-bottom: 2px; }

.goals-row {
  display: flex; gap: 6px; margin-top: 8px;
}
.goals-input {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: var(--radius-sm);
  font-size: 14px;
  text-align: center;
}
.goals-input:focus { outline: none; border-color: var(--gold); }
.goals-btn {
  padding: 10px 16px;
  border: none;
  background: var(--gold);
  color: #000;
  border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 700;
  cursor: pointer;
}

.pred-done {
  background: rgba(52,211,153,0.1);
  border: 1px solid rgba(52,211,153,0.3);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px; color: var(--green);
  text-align: center; font-weight: 600;
}

/* ── LEADERBOARD ── */
.lb-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.lb-rank {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 12px; font-weight: 700;
  background: var(--surface); color: var(--text2);
}
.rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; }
.rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #000; }
.rank-3 { background: linear-gradient(135deg, #b45309, #92400e); color: #fff; }

.lb-info { flex: 1; }
.lb-name { font-size: 14px; font-weight: 600; }
.lb-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.lb-bal { font-size: 14px; font-weight: 700; color: var(--gold); }

/* ── HISTORY ── */
.hist-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.hist-match { font-size: 13px; font-weight: 600; }
.hist-pred { font-size: 11px; color: var(--text2); margin-top: 2px; }
.hist-result {
  font-size: 11px; font-weight: 600;
  padding: 4px 10px; border-radius: 10px;
}
.hist-pending { background: rgba(96,165,250,0.15); color: var(--blue); }
.hist-won { background: rgba(52,211,153,0.15); color: var(--green); }
.hist-lost { background: rgba(248,113,113,0.15); color: var(--red); }

/* ── PROFILE ── */
.profile-hero {
  text-align: center;
  padding: 24px 16px;
  background: linear-gradient(180deg, rgba(251,191,36,0.08) 0%, transparent 100%);
  border-radius: var(--radius);
  margin-bottom: 16px;
}
.profile-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 800; color: #000;
  margin: 0 auto 12px;
}
.profile-name { font-size: 18px; font-weight: 700; }
.profile-uname { font-size: 13px; color: var(--text2); margin-top: 2px; }

.profile-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-top: 16px;
}
.pstat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
}
.pstat-val { font-size: 16px; font-weight: 700; color: var(--gold); }
.pstat-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }

.ref-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  margin-top: 12px;
}
.ref-title { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.ref-code {
  font-size: 20px; font-weight: 800;
  color: var(--gold);
  letter-spacing: 4px;
  padding: 12px;
  background: rgba(251,191,36,0.08);
  border-radius: var(--radius-sm);
  cursor: pointer;
  user-select: all;
}
.ref-sub { font-size: 11px; color: var(--text3); margin-top: 8px; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 13px; font-weight: 600;
  z-index: 1000;
  opacity: 0; transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: var(--green); color: var(--green); }
.toast.err { border-color: var(--red); color: var(--red); }

/* ── EMPTY ── */
.empty { text-align: center; padding: 40px 20px; }
.empty-icon { font-size: 40px; margin-bottom: 8px; }
.empty-text { font-size: 14px; color: var(--text3); }

/* ── ANIMATIONS ── */
.fade-up {
  animation: fadeUp 0.4s ease-out both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── CONFETTI ── */
.confetti-piece {
  position: fixed;
  width: 8px; height: 8px;
  top: -10px;
  z-index: 9998;
  animation: confFall 2.5s linear forwards;
}
@keyframes confFall {
  to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ── GROUP FILTER ── */
.group-filter {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 0 0 12px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.group-filter::-webkit-scrollbar { display: none; }
.group-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.group-chip.active {
  background: var(--gold);
  color: #000;
  border-color: var(--gold);
}

/* ── RESPONSIVE ── */
@media (min-width: 480px) {
  .content { max-width: 480px; margin: 0 auto; }
  .header { max-width: 480px; margin: 0 auto; }
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Loading CupCash...</div>
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="logo">
      <span class="logo-icon">🏆</span>
      <span>CupCash</span>
    </div>
    <div class="pool-badge" id="pool-display">$50,000 Pool</div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="matches" onclick="goTab('matches')">
      <span class="tab-icon">⚽</span>Matches
    </button>
    <button class="tab" data-tab="history" onclick="goTab('history')">
      <span class="tab-icon">📋</span>History
    </button>
    <button class="tab" data-tab="leaderboard" onclick="goTab('leaderboard')">
      <span class="tab-icon">🏆</span>Top
    </button>
    <button class="tab" data-tab="profile" onclick="goTab('profile')">
      <span class="tab-icon">👤</span>Profile
    </button>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- MATCHES TAB -->
  <div class="tab-panel active" id="tab-matches">
    <div class="stats-bar">
      <div class="stat-box">
        <div class="stat-val" id="stat-users">0</div>
        <div class="stat-lbl">Players</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-preds">0</div>
        <div class="stat-lbl">Predictions</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-live">0</div>
        <div class="stat-lbl">Live</div>
      </div>
    </div>
    <div class="group-filter" id="group-filter"></div>
    <div id="matches-list"></div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-panel" id="tab-history">
    <div id="history-list"></div>
  </div>

  <!-- LEADERBOARD TAB -->
  <div class="tab-panel" id="tab-leaderboard">
    <div id="lb-list"></div>
  </div>

  <!-- PROFILE TAB -->
  <div class="tab-panel" id="tab-profile">
    <div id="profile-content"></div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
// CUP CASH v3.0 — FULL APPLICATION
// ═══════════════════════════════════════

const S = {
  user: null,
  matches: [],
  preds: {},
  allUserPreds: [],
  tg: null,
  filter: 'all'
};

// ── API CONFIG ──
const API_BASE = 'https://api.clickrunclaw.com';

// ── TELEGRAM INIT ──
try {
  if (window.Telegram?.WebApp) {
    S.tg = window.Telegram.WebApp;
    S.tg.ready();
    S.tg.expand();
    S.tg.setHeaderColor('#0a0e17');
    S.tg.setBackgroundColor('#0a0e17');
    if (S.tg.setBottomBarColor) S.tg.setBottomBarColor('#0a0e17');
  }
} catch(e) {}

// ── API HELPERS ──
async function post(path, body) {
  const r = await fetch(API_BASE + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}
async function get(path) {
  const r = await fetch(API_BASE + path);
  return r.json();
}

// ── INIT ──
async function init() {
  try {
    let userData = null;
    if (S.tg?.initDataUnsafe?.user) {
      userData = S.tg.initDataUnsafe.user;
    } else {
      userData = { id: Math.floor(Math.random() * 999999), first_name: 'Player', username: 'player_' + Math.floor(Math.random() * 9999) };
    }
    const ref = S.tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('ref') || '';

    const res = await post('/api/init', { user: userData, referral: ref, initData: S.tg?.initData || '' });
    if (res.user) {
      S.user = res.user;
      updateUserUI();
    }

    await Promise.all([loadMatches(), loadLeaderboard(), loadStats(), loadUserPreds()]);
    buildGroupFilter();

    setTimeout(() => { document.getElementById('loader').classList.add('done'); }, 500);
  } catch(e) {
    console.error('Init error:', e);
    toast('Connection error. Retrying...', 'err');
    setTimeout(init, 2000);
  }
}

// ── USER UI ──
function updateUserUI() {
  if (!S.user) return;
  const el = document.getElementById('profile-content');
  if (!el) return;
  renderProfile();
}

// ── MATCHES ──
async function loadMatches() {
  try {
    const data = await get('/api/matches');
    S.matches = data.matches || [];
    renderMatches();
    const live = S.matches.filter(m => ['live','1H','2H','HT','ET','PEN'].includes(m.status)).length;
    const el = document.getElementById('stat-live');
    if (el) el.textContent = live;
  } catch(e) { console.error(e); }
}

function buildGroupFilter() {
  const groups = [...new Set(S.matches.map(m => m.group_name).filter(Boolean))].sort();
  const el = document.getElementById('group-filter');
  if (!el) return;
  el.innerHTML = `<div class="group-chip active" onclick="filterGroup('all')">All</div>` +
    groups.map(g => `<div class="group-chip" onclick="filterGroup('${g}')">Group ${g}</div>`).join('');
}

function filterGroup(g) {
  S.filter = g;
  document.querySelectorAll('.group-chip').forEach(c => c.classList.toggle('active', c.textContent.includes(g === 'all' ? 'All' : g)));
  renderMatches();
}

function renderMatches() {
  const el = document.getElementById('matches-list');
  let matches = S.matches;
  if (S.filter !== 'all') matches = matches.filter(m => m.group_name === S.filter);

  if (!matches.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">⚽</div><div class="empty-text">No matches found</div></div>';
    return;
  }

  el.innerHTML = matches.map((m, i) => {
    const isLive = ['live','1H','2H','HT','ET','PEN'].includes(m.status);
    const isDone = ['completed','FT','FT_PEN'].includes(m.status);
    const canPredict = !isLive && !isDone;
    const myPred = S.preds[m.id] || {};
    const hasWinner = !!myPred.winner;
    const hasGoals = !!myPred.goals;
    const hasAny = hasWinner || hasGoals;

    const badgeClass = isLive ? 'badge-live' : (isDone ? 'badge-completed' : 'badge-scheduled');
    const badgeText = isLive ? '● LIVE' : (isDone ? 'FT' : 'UPCOMING');
    const cardClass = 'match-card fade-up' + (isLive?' live':'') + (isDone?' completed':'') + (hasAny?' has-pred':'');

    const scoreHTML = (m.home_score != null && m.away_score != null)
      ? `<div class="match-center"><div class="match-score">${m.home_score}<span class="sep">-</span>${m.away_score}</div></div>`
      : `<div class="match-center"><div class="match-vs">VS</div></div>`;

    let predHTML = '';
    if (canPredict) {
      if (hasAny) {
        const parts = [];
        if (hasWinner) {
          const w = myPred.winner.prediction;
          const lbl = w === 'home' ? m.home_code : (w === 'away' ? m.away_code : 'Draw');
          parts.push(`🏆 ${lbl}`);
        }
        if (hasGoals) parts.push(`⚽ ${myPred.goals.prediction} goals`);
        predHTML = `<div class="pred-area"><div class="pred-done">✅ ${parts.join(' • ')}</div></div>`;
      } else {
        predHTML = `
        <div class="pred-area">
          <div class="pred-label">🏆 Pick Winner</div>
          <div class="pred-row">
            <button class="pred-btn" onclick="pickWinner(${m.id},'home')"><span class="pred-btn-emoji">🏠</span>${m.home_code||'H'}</button>
            <button class="pred-btn" onclick="pickWinner(${m.id},'draw')"><span class="pred-btn-emoji">🤝</span>Draw</button>
            <button class="pred-btn" onclick="pickWinner(${m.id},'away')"><span class="pred-btn-emoji">✈️</span>${m.away_code||'A'}</button>
          </div>
          <div class="pred-label" style="margin-top:8px;">⚽ Total Goals</div>
          <div class="goals-row">
            <input type="number" class="goals-input" id="g-${m.id}" min="0" max="20" placeholder="0">
            <button class="goals-btn" onclick="pickGoals(${m.id})">Save</button>
          </div>
        </div>`;
      }
    } else if (hasAny) {
      const parts = [];
      if (hasWinner) {
        const w = myPred.winner.prediction;
        const lbl = w === 'home' ? m.home_code : (w === 'away' ? m.away_code : 'Draw');
        parts.push(`🏆 ${lbl}`);
      }
      if (hasGoals) parts.push(`⚽ ${myPred.goals.prediction}`);
      predHTML = `<div class="pred-area"><div class="pred-done">📌 Your pick: ${parts.join(' • ')}</div></div>`;
    }

    return `
    <div class="${cardClass}" style="animation-delay:${i*0.04}s">
      <div class="match-header">
        <span class="match-group">Group ${m.group_name||'•'} • ${m.stadium||''}</span>
        <span class="match-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="match-body">
        <div class="match-time">
          <span class="match-time-item">🇧🇩 ${m.kickoff_bd||'--:--'}</span>
          <span class="match-time-item">🌍 ${m.kickoff_utc_display||''}</span>
        </div>
        <div class="match-teams">
          <div class="team">
            <div class="team-flag">${flag(m.home_code)}</div>
            <div class="team-name">${m.home_team}</div>
            <div class="team-code">${m.home_code||''}</div>
          </div>
          ${scoreHTML}
          <div class="team">
            <div class="team-flag">${flag(m.away_code)}</div>
            <div class="team-name">${m.away_team}</div>
            <div class="team-code">${m.away_code||''}</div>
          </div>
        </div>
      </div>
      ${predHTML}
    </div>`;
  }).join('');
}

function flag(code) {
  const f = {
    'MEX':'🇲🇽','RSA':'🇿🇦','KOR':'🇰🇷','CZE':'🇨🇿','CAN':'🇨🇦','BIH':'🇧🇦','QAT':'🇶🇦','SUI':'🇨🇭',
    'HAI':'🇭🇹','SCO':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','BRA':'🇧🇷','MAR':'🇲🇦','USA':'🇺🇸','PAR':'🇵🇾','AUS':'🇦🇺','TUR':'🇹🇷',
    'CIV':'🇨🇮','ECU':'🇪🇨','GER':'🇩🇪','CUW':'🇨🇼','ARG':'🇦🇷','ALG':'🇩🇿','ENG':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','CRO':'🇭🇷',
    'FRA':'🇫🇷','SEN':'🇸🇳','ESP':'🇪🇸','UZB':'🇺🇿','POR':'🇵🇹','GHA':'🇬🇭','NED':'🇳🇱','COL':'🇨🇴',
    'IRQ':'🇮🇶','JOR':'🇯🇴','CPV':'🇨🇻','TUN':'🇹🇳','IRN':'🇮🇷','JPN':'🇯🇵','NGA':'🇳🇬','CMR':'🇨🇲',
    'GHA':'🇬🇭','KSA':'🇸🇦','URU':'🇺🇾','PAN':'🇵🇦','CRC':'🇨🇷','UKR':'🇺🇦','NOR':'🇳🇴','SWE':'🇸🇪',
    'DEN':'🇩🇰','SRB':'🇷🇸','POL':'🇵🇱','BEL':'🇧🇪','WAL':'🏴󠁧󠁢󠁷󠁬󠁳󠁿','ITA':'🇮🇹','NOR':'🇳🇴'
  };
  return f[code] || '🏳️';
}

// ── PREDICTIONS ──
async function pickWinner(matchId, val) {
  if (!S.user) return;
  try {
    const res = await post('/api/predict', { user_id: S.user.id, match_id: matchId, type: 'winner', prediction: val });
    if (res.success) {
      if (!S.preds[matchId]) S.preds[matchId] = {};
      S.preds[matchId].winner = { prediction: val };
      renderMatches();
      toast('✅ Winner saved!', 'ok');
      confetti();
    } else toast(res.error || 'Failed', 'err');
  } catch(e) { toast('Error', 'err'); }
}

async function pickGoals(matchId) {
  if (!S.user) return;
  const el = document.getElementById('g-' + matchId);
  const val = parseInt(el?.value);
  if (isNaN(val) && val !== 0) { toast('Enter a number', 'err'); return; }
  try {
    const res = await post('/api/predict', { user_id: S.user.id, match_id: matchId, type: 'goals', prediction: val });
    if (res.success) {
      if (!S.preds[matchId]) S.preds[matchId] = {};
      S.preds[matchId].goals = { prediction: val };
      renderMatches();
      toast('✅ Goals saved!', 'ok');
      confetti();
    } else toast(res.error || 'Failed', 'err');
  } catch(e) { toast('Error', 'err'); }
}

// ── LOAD USER PREDICTIONS ──
async function loadUserPreds() {
  if (!S.user) return;
  try {
    const data = await get('/api/user/' + S.user.id);
    if (data.predictions) {
      S.allUserPreds = data.predictions;
      data.predictions.forEach(p => {
        if (!S.preds[p.match_id]) S.preds[p.match_id] = {};
        if (p.winner) S.preds[p.match_id].winner = p.winner;
        if (p.goals) S.preds[p.match_id].goals = p.goals;
      });
      renderMatches();
      renderHistory();
    }
    if (data.user) {
      S.user = data.user;
      updateUserUI();
    }
  } catch(e) { console.error(e); }
}

// ── HISTORY ──
function renderHistory() {
  const el = document.getElementById('history-list');
  if (!S.allUserPreds.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No predictions yet. Start predicting!</div></div>';
    return;
  }
  el.innerHTML = S.allUserPreds.map((p, i) => {
    const m = S.matches.find(x => x.id == p.match_id);
    const matchName = m ? `${m.home_team} vs ${m.away_team}` : `Match #${p.match_id}`;
    const parts = [];
    if (p.winner) {
      const w = p.winner.prediction;
      parts.push(`Winner: ${w === 'home' ? 'Home' : (w === 'away' ? 'Away' : 'Draw')}`);
    }
    if (p.goals) parts.push(`Goals: ${p.goals.prediction}`);
    const isDone = m && ['completed','FT','FT_PEN'].includes(m.status);
    const resultClass = isDone ? 'hist-pending' : 'hist-pending';
    const resultText = isDone ? '⏳ Scored' : '⏳ Pending';
    return `
    <div class="hist-item fade-up" style="animation-delay:${i*0.04}s">
      <div>
        <div class="hist-match">${matchName}</div>
        <div class="hist-pred">${parts.join(' • ') || 'No details'}</div>
      </div>
      <div class="hist-result ${resultClass}">${resultText}</div>
    </div>`;
  }).join('');
}

// ── LEADERBOARD ──
async function loadLeaderboard() {
  try {
    const data = await get('/api/leaderboard');
    renderLB(data.leaderboard || []);
  } catch(e) { console.error(e); }
}

function renderLB(list) {
  const el = document.getElementById('lb-list');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🏆</div><div class="empty-text">Be the first predictor!</div></div>';
    return;
  }
  el.innerHTML = list.map((p, i) => {
    const rc = i === 0 ? 'rank-1' : (i === 1 ? 'rank-2' : (i === 2 ? 'rank-3' : ''));
    return `
    <div class="lb-item fade-up" style="animation-delay:${i*0.03}s">
      <div class="lb-rank ${rc}">${i+1}</div>
      <div class="lb-info">
        <div class="lb-name">${p.name||'Player'}</div>
        <div class="lb-sub">${p.correct||0}/${p.total||0} correct • ${p.referrals||0} refs</div>
      </div>
      <div class="lb-bal">$${(p.balance||0).toLocaleString()}</div>
    </div>`;
  }).join('');
}

// ── STATS ──
async function loadStats() {
  try {
    const data = await get('/api/stats');
    document.getElementById('stat-users').textContent = data.total_users || 0;
    document.getElementById('stat-preds').textContent = data.total_predictions || 0;
  } catch(e) {}
}

// ── PROFILE ──
function renderProfile() {
  if (!S.user) return;
  const el = document.getElementById('profile-content');
  el.innerHTML = `
    <div class="profile-hero fade-up">
      <div class="profile-avatar">${(S.user.first_name||'?')[0].toUpperCase()}</div>
      <div class="profile-name">${S.user.first_name||'Player'} ${S.user.last_name||''}</div>
      <div class="profile-uname">@${S.user.username||'no_username'}</div>
      <div class="profile-grid">
        <div class="pstat"><div class="pstat-val">$${(S.user.balance||0).toLocaleString()}</div><div class="pstat-lbl">Balance</div></div>
        <div class="pstat"><div class="pstat-val">${S.user.predictions_correct||0}</div><div class="pstat-lbl">Correct</div></div>
        <div class="pstat"><div class="pstat-val">${(S.user.referrals||[]).length}</div><div class="pstat-lbl">Refs</div></div>
      </div>
    </div>
    <div class="ref-box fade-up">
      <div class="ref-title">🎁 Your Referral Code</div>
      <div class="ref-code" onclick="copyRef()">${S.user.referral_code||'N/A'}</div>
      <div class="ref-sub">Tap to copy • Earn 100 points per friend!</div>
    </div>`;
}

function copyRef() {
  if (!S.user?.referral_code) return;
  const link = `https://t.me/CupCash_Bot?startapp=${S.user.referral_code}`;
  try { navigator.clipboard.writeText(link); } catch(e) {}
  toast('✅ Link copied!', 'ok');
}

// ── TABS ──
function goTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'profile') renderProfile();
  if (name === 'history') renderHistory();
  if (name === 'leaderboard') loadLeaderboard();
}

// ── TOAST ──
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type||'') + ' show';
  setTimeout(() => el.className = 'toast', 2500);
}

// ── CONFETTI ──
function confetti() {
  const colors = ['#fbbf24','#34d399','#60a5fa','#a78bfa','#f87171','#18ffff'];
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.className = 'confetti-piece';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.animationDelay = Math.random() * 0.5 + 's';
    d.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2500);
  }
}

// ── START ──
init();
setInterval(loadMatches, 30000);
</script>
